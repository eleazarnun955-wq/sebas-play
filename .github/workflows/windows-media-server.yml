name: SEBAS PLAY Windows media server checks

on:
  workflow_dispatch:
  push:
    branches: [main, feature/windows-media-server-android-roku, fix/windows-server-first-run, fix/windows-media-network-autostart, sebas-play-pro40-independent-20261125, sebas-play-pro50-independent-20261125]
    paths:
      - "server/windows-media/**"
      - ".github/workflows/windows-media-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/windows-media/**"
      - ".github/workflows/windows-media-server.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and installer consent contract
        run: |
          node --check server/windows-media/server.mjs
          node server/windows-media/installer-contract-test.mjs
      - name: Smoke test landing page, health, protected catalog and HTTP Range streaming
        run: node server/windows-media/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-Windows-10-Server-FIXED
          path: |
            server/windows-media/
            !server/windows-media/server-config.bat
            !server/windows-media/Peliculas/**
            !server/windows-media/*.log
          if-no-files-found: error
          retention-days: 30
