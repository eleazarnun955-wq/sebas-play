name: SEBAS PLAY Windows media server checks

on:
  workflow_dispatch:
  push:
    branches: [main, feature/windows-media-server-android-roku, fix/windows-server-first-run, fix/windows-media-network-autostart, fix/sebas-play-connection-vlc-playback-20261125d, sebas-play-110-mi-laptop-vlc-independent-20261125, sebas-play-13-0-independent-full-improvements-20261126]
    paths:
      - "server/windows-media/**"
      - ".github/workflows/windows-media-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/windows-media/**"
      - ".github/workflows/windows-media-server.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check server/windows-media/server.mjs
      - name: Smoke test recursive MP4/MKV/AVI catalog, protected access and HTTP Range streaming
        run: node server/windows-media/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-Windows-10-Server-FIXED
          path: |
            server/windows-media/
            !server/windows-media/server-config.bat
            !server/windows-media/Peliculas/**
            !server/windows-media/*.log
          if-no-files-found: error
          retention-days: 30
