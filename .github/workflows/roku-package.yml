name: SEBAS PLAY PRO 3.2 MI LAPTOP Roku channel

on:
  workflow_dispatch:
  push:
    branches: [fix/sebas-play-pro32-independent-install-20261125, fix/sebas-play-pro32-mi-laptop-independent-20261124, main, sebas-play-pro30-streaming-android-roku, feature/windows-media-server-android-roku, feature/sebas-play-remote-access-20261123]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Roku channel structure
        run: |
          test -f apps/roku/manifest
          test -f apps/roku/source/main.brs
          test -f apps/roku/components/HomeScene.xml
          test -f apps/roku/components/CatalogTask.xml
          test -f apps/roku/components/PlayerScene.xml
          grep -qx "title=SEBAS PLAY" apps/roku/manifest
          grep -qx "mm_icon_focus_fhd=pkg:/images/icon_focus_fhd.png" apps/roku/manifest
          grep -qx "mm_icon_focus_hd=pkg:/images/icon_focus_hd.png" apps/roku/manifest
          grep -qx "hidden=0" apps/roku/manifest
      - name: Generate Roku artwork with official dimensions
        run: |
          python3 -m pip install --quiet Pillow
          cd apps/roku
          python3 generate-icons.py
          python3 - <<'PY'
          from PIL import Image
          expected = {
              "icon_focus_fhd.png": (540, 405),
              "icon_focus_hd.png": (290, 218),
              "icon_side_hd.png": (214, 144),
              "splash_fhd.png": (1920, 1080),
              "splash_hd.png": (1280, 720),
              "splash_sd.png": (720, 480),
          }
          for name, size in expected.items():
              path = "images/" + name
              with Image.open(path) as image:
                  assert image.size == size, f"{name}: {image.size}, expected {size}"
          PY
      - name: Package channel with manifest at ZIP root
        run: |
          cd apps/roku
          zip -r ../../SEBAS-PLAY-Roku.zip . -x "*.DS_Store"
          cd ../..
          unzip -Z1 SEBAS-PLAY-Roku.zip | grep -qx "manifest"
          unzip -Z1 SEBAS-PLAY-Roku.zip | grep -qx "source/main.brs"
          unzip -Z1 SEBAS-PLAY-Roku.zip | grep -qx "images/icon_focus_fhd.png"
          unzip -Z1 SEBAS-PLAY-Roku.zip | grep -qx "images/splash_hd.png"
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-PRO-3-2-MI-LAPTOP-Roku-channel
          path: SEBAS-PLAY-Roku.zip
          retention-days: 14
