name: SEBAS PLAY 28.0 independiente Roku channel

on:
  workflow_dispatch:
  push:
    branches: [feature/sebas-play-28-cinematic-intro-20261128]
    paths:
      - "apps/roku/**"
      - "scripts/verify-roku-flow.mjs"
      - "scripts/verify-live-tv.mjs"
      - "scripts/verify-live-tv.mjs"
      - ".github/workflows/roku-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent Roku 28.0 channel
        run: |
          test -f apps/roku/manifest
          test -f apps/roku/source/main.brs
          test -f apps/roku/components/HomeScene.xml
          test -f apps/roku/components/CatalogTask.xml
          test -f apps/roku/components/PlayerScene.xml
          grep -q "title=SEBAS PLAY 28.0" apps/roku/manifest
          grep -q "major_version=28" apps/roku/manifest
          grep -q 'roRegistrySection", "SEBASPLAY27"' apps/roku/components/HomeScene.brs
          grep -q 'roRegistrySection", "SEBASPLAY27"' apps/roku/components/PlayerScene.brs
          ! grep -q 'roRegistrySection", "SEBASPLAY"' apps/roku/components/HomeScene.brs
          ! grep -q 'roRegistrySection", "SEBASPLAY"' apps/roku/components/PlayerScene.brs
      - name: Verify Roku connection and playback flow regression checks
        run: node scripts/verify-roku-flow.mjs
      - name: Verify direct Spanish live TV candidate rules
        run: node scripts/verify-live-tv.mjs
      - name: Generate branded Roku home screen icons
        run: |
          python3 -m pip install --quiet Pillow
          cd apps/roku
          python3 generate-icons.py
          test -s images/icon_focus_fhd.png
          test -s images/icon_focus_hd.png
          test -s images/icon_side_hd.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = {"icon_focus_fhd.png": (540, 405), "icon_focus_hd.png": (290, 218), "icon_side_hd.png": (214, 144)}
          for name, size in expected.items():
              with Image.open(Path("images") / name) as im:
                  assert im.size == size, f"{name}: expected {size}, got {im.size}"
          PY
          grep -q "mm_icon_focus_fhd=pkg:/images/icon_focus_fhd.png" manifest
          grep -q "mm_icon_focus_hd=pkg:/images/icon_focus_hd.png" manifest
          grep -q "mm_icon_side_hd=pkg:/images/icon_side_hd.png" manifest
      - name: Generate original spoken SEBAS PLAY intro audio
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak
          mkdir -p apps/roku/audio
          espeak -v es-la -s 135 -p 48 -a 180 -w apps/roku/audio/sebas-play-intro.wav "SEBAS PLAY"
          test -s apps/roku/audio/sebas-play-intro.wav
      - name: Package and verify Roku channel ZIP root
        run: |
          mkdir -p dist/roku
          cd apps/roku
          zip -r ../../dist/roku/SEBAS-PLAY-Roku-28-0.zip . -x "*.DS_Store" "*.zip"
          cd ../..
          unzip -Z1 dist/roku/SEBAS-PLAY-Roku-28-0.zip > dist/roku/package-files.txt
          grep -qx "manifest" dist/roku/package-files.txt
          ! grep -q "SEBAS-PLAY-Roku-28-0.zip" dist/roku/package-files.txt
          grep -qx "source/main.brs" dist/roku/package-files.txt
          grep -qx "components/HomeScene.xml" dist/roku/package-files.txt
          grep -qx "audio/sebas-play-intro.wav" dist/roku/package-files.txt
          echo "Verified: manifest is at ZIP root and no nested ZIP is present."
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-28-0-ROKU-INDEPENDIENTE
          path: dist/roku/SEBAS-PLAY-Roku-28-0.zip
          if-no-files-found: error
          retention-days: 14
