name: SEBAS PLAY 12.0 independiente Roku channel

on:
  workflow_dispatch:
  push:
    branches: [sebas-play-120-independent-full-improvements-20261126]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent Roku 12.0 channel
        run: |
          test -f apps/roku/manifest
          test -f apps/roku/source/main.brs
          test -f apps/roku/components/HomeScene.xml
          test -f apps/roku/components/CatalogTask.xml
          test -f apps/roku/components/PlayerScene.xml
          grep -q "title=SEBAS PLAY 12.0" apps/roku/manifest
          grep -q "major_version=12" apps/roku/manifest
      - name: Generate branded Roku home screen icons
        run: |
          python3 -m pip install --quiet Pillow
          cd apps/roku
          python3 generate-icons.py
          test -s images/icon_focus_hd.png
          test -s images/icon_side_hd.png
      - name: Package Roku channel
        run: |
          cd apps/roku
          zip -r ../../SEBAS-PLAY-Roku-12-0.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-12-0-ROKU-INDEPENDIENTE
          path: SEBAS-PLAY-Roku-12-0.zip
          retention-days: 14
