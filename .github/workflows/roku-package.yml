name: SEBAS PLAY 13.0 independiente Roku channel

on:
  workflow_dispatch:
  push:
    branches: [sebas-play-13-0-independent-full-improvements-20261126]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent Roku 13.0 channel
        run: |
          test -f apps/roku/manifest
          test -f apps/roku/source/main.brs
          test -f apps/roku/components/HomeScene.xml
          test -f apps/roku/components/CatalogTask.xml
          test -f apps/roku/components/PlayerScene.xml
          grep -q "title=SEBAS PLAY 13.0" apps/roku/manifest
          grep -q "major_version=13" apps/roku/manifest
          grep -q 'roRegistrySection", "SEBASPLAY13"' apps/roku/components/HomeScene.brs
          grep -q 'roRegistrySection", "SEBASPLAY13"' apps/roku/components/PlayerScene.brs
          ! grep -q 'roRegistrySection", "SEBASPLAY"' apps/roku/components/HomeScene.brs
          ! grep -q 'roRegistrySection", "SEBASPLAY"' apps/roku/components/PlayerScene.brs
      - name: Generate branded Roku home screen icons
        run: |
          python3 -m pip install --quiet Pillow
          cd apps/roku
          python3 generate-icons.py
          test -s images/icon_focus_hd.png
          test -s images/icon_side_hd.png
      - name: Package and verify Roku channel ZIP root
        run: |
          mkdir -p dist/roku
          cd apps/roku
          zip -r ../../dist/roku/SEBAS-PLAY-Roku-13-0.zip . -x "*.DS_Store" "*.zip"
          cd ../..
          unzip -Z1 dist/roku/SEBAS-PLAY-Roku-13-0.zip > dist/roku/package-files.txt
          grep -qx "manifest" dist/roku/package-files.txt
          ! grep -q "SEBAS-PLAY-Roku-13-0.zip" dist/roku/package-files.txt
          grep -qx "source/main.brs" dist/roku/package-files.txt
          grep -qx "components/HomeScene.xml" dist/roku/package-files.txt
          echo "Verified: manifest is at ZIP root and no nested ZIP is present."
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-13-0-ROKU-INDEPENDIENTE
          path: dist/roku/SEBAS-PLAY-Roku-13-0.zip
          if-no-files-found: error
          retention-days: 14
