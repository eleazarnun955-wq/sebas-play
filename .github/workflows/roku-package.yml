name: SEBAS PLAY PRO 3.1 Laptop Roku channel

on:
  workflow_dispatch:
  push:
    branches: [main, sebas-play-pro30-streaming-android-roku, feature/windows-media-server-android-roku, feature/sebas-play-remote-access-20261123]
    paths:
      - "apps/roku/**"
      - ".github/workflows/roku-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Roku channel structure
        run: |
          test -f apps/roku/manifest
          test -f apps/roku/source/main.brs
          test -f apps/roku/components/HomeScene.xml
          test -f apps/roku/components/CatalogTask.xml
          test -f apps/roku/components/PlayerScene.xml
          grep -q "title=SEBAS PLAY" apps/roku/manifest
      - name: Generate branded Roku home screen icons
        run: |
          python3 -m pip install --quiet Pillow
          cd apps/roku
          python3 generate-icons.py
          test -s images/icon_focus_hd.png
          test -s images/icon_side_hd.png
      - name: Package Roku channel
        run: |
          cd apps/roku
          zip -r ../../SEBAS-PLAY-Roku.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-PRO-3-1-LAPTOP-Roku-channel
          path: SEBAS-PLAY-Roku.zip
          retention-days: 14
