name: SEBAS PLAY CI

on:
  push:
    branches: [main, sebas-play-pro40-independent-20261125, sebas-play-pro50-independent-20261125]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify PRO 5.0 platform identity and Roku playback controls
        run: |
          grep -q 'text="SEBAS PLAY PRO 5.0"' apps/roku-pro40/components/HomeScene.xml
          grep -q '^title=SEBAS PLAY PRO 5.0$' apps/roku-pro40/manifest
          grep -q '^major_version=5$' apps/roku-pro40/manifest
          grep -q 'com.eleazarcompany.sebasplay.pro50.independent20261125' capacitor.pro40.config.ts
          grep -q 'm.video.enableUI = true' apps/roku-pro40/components/PlayerScene.brs
          grep -q 'else if state = "paused"' apps/roku-pro40/components/PlayerScene.brs
          grep -q 'else if state = "error"' apps/roku-pro40/components/PlayerScene.brs
      - name: Build admin panel
        run: npm run build
