name: SEBAS PLAY PRO 2.1 CORREGIDA V2 Android APK

on:
  workflow_dispatch:
  push:
    branches: [fix/sebas-play-pro21-auth-session]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      # Supabase publishable key is designed for client-side use.
      # Never add a service_role key to this workflow or the Android app.
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ououwdzxywmjpppzqxqy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y3FtFQtvnYVcmy2VTJaYDQ_QhZlj4tx

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify generated Android package ID
        run: |
          EXPECTED_APPLICATION_ID="com.eleazarcompany.sebasplay.pro21fix2"
          ACTUAL_APPLICATION_ID=$(grep -oE 'applicationId[[:space:]]+"[^"]+"' android/app/build.gradle | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          echo "Expected package: $EXPECTED_APPLICATION_ID"
          echo "Generated package: $ACTUAL_APPLICATION_ID"
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify final APK package ID
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          ACTUAL_PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          EXPECTED_PACKAGE="com.eleazarcompany.sebasplay.pro21fix2"
          echo "Final APK package: $ACTUAL_PACKAGE"
          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"

      - name: Upload independent SEBAS PLAY APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-PRO-2-1-CORREGIDA-V2-INDEPENDIENTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
