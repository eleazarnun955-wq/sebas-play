name: SEBAS PLAY PRO 2.2 ADULTOS Android APK
# PRO 2.2 uses a distinct Android applicationId to install alongside PRO 2.1.

on:
  workflow_dispatch:
  push:
    branches: [main, sebas-play-netflix-icon-pro21, sebas-play-pro22-adultos-independent]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ououwdzxywmjpppzqxqy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y3FtFQtvnYVcmy2VTJaYDQ_QhZlj4tx

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate SEBAS PLAY Android launcher icons
        run: node scripts/generate-android-icons.mjs

      - name: Build APK for separate installation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SEBAS PLAY NUEVA APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-PRO-2-2-ADULTOS-INDEPENDIENTE-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
