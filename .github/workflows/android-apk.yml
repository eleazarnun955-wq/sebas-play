name: SEBAS PLAY 13.0 independiente Android APK
# Independent package: preserve 12.0, 11.0 and all previous installs.

on:
  workflow_dispatch:
  push:
    branches: [sebas-play-13-0-independent-full-improvements-20261126]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ououwdzxywmjpppzqxqy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y3FtFQtvnYVcmy2VTJaYDQ_QhZlj4tx
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Allow signed HTTP media from Windows laptop
        run: node scripts/enable-android-local-http.mjs
      - name: Integrate native VLC media engine for Android
        run: node scripts/install-vlc-android.mjs
      - name: Generate SEBAS PLAY Android launcher icons
        run: node scripts/generate-android-icons.mjs
      - name: Build APK for separate installation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify package ID is the new independent 13.0 one
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          EXPECTED="com.eleazarcompany.sebasplay.v13.independiente20261126"
          echo "APK package ID: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.v12.independiente20261126"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.v11.miLaptopVlc20261125"
      - name: Upload SEBAS PLAY 13.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-13-0-ANDROID-INDEPENDIENTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
