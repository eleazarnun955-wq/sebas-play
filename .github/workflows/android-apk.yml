name: SEBAS PLAY 10.0 MI LAPTOP + VLC Android APK
# A new package ID avoids replacing or colliding with every previous SEBAS PLAY build.
# Verification matches the unique independent SEBAS PLAY 10.0 package ID.

on:
  workflow_dispatch:
  push:
    branches: [main, sebas-play-netflix-icon-pro21, sebas-play-pro22-adultos-independent, sebas-play-pro30-streaming-android-roku, feature/windows-media-server-android-roku, fix/android-local-http-video-playback, fix/unique-package-install-20261124c, fix/pro30-vlc-package-unique-20261125g3, fix/sebas-play-connection-vlc-playback-20261125d, sebas-play-100-mi-laptop-vlc-independent-20261125]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ououwdzxywmjpppzqxqy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y3FtFQtvnYVcmy2VTJaYDQ_QhZlj4tx

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Allow signed HTTP media from Windows laptop
        run: node scripts/enable-android-local-http.mjs

      - name: Integrate native VLC media engine for Android
        run: node scripts/install-vlc-android.mjs

      - name: Generate SEBAS PLAY Android launcher icons
        run: node scripts/generate-android-icons.mjs

      - name: Build APK for separate installation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify package ID is the new independent one
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          EXPECTED="com.eleazarcompany.sebasplay.v10.miLaptopVlc20261125"
          echo "APK package ID: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.pro30streaming20261120"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.pro22.adult20261120"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.pro21.independent20261120"

      - name: Upload SEBAS PLAY 10.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-10-0-MI-LAPTOP-VLC-INDEPENDIENTE-20261125
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh verification build for the independent 10.0 branch.
