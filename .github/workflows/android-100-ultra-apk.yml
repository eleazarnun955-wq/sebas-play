name: SEBAS PLAY 10.0 ULTRA — APK independiente

on:
  workflow_dispatch:
  push:
    branches: [sebas-play-100-ultra-independent-20261125]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "server/windows-media/**"
      - "package.json"
      - "capacitor.100-ultra.config.ts"
      - ".github/workflows/android-100-ultra-apk.yml"

permissions:
  contents: read

jobs:
  android-100-ultra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Test Windows laptop server and full catalog scan
        run: node server/windows-media/smoke-test.mjs
      - name: Build interface with catalog service configured
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ououwdzxywmjpppzqxqy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y3FtFQtvnYVcmy2VTJaYDQ_QhZlj4tx
          VITE_SEBAS_PRO50: "true"
      - name: Verify direct laptop button and robust connection are included
        run: |
          grep -R -F "Mi laptop" dist/assets
          grep -R -F "No se pudo alcanzar la laptop" dist/assets
          grep -R -F "/api/scan" dist/assets
          grep -R -F "Sincronizar todo al catálogo" dist/assets
      - name: Set exclusive 10.0 app identity
        run: cp capacitor.100-ultra.config.ts capacitor.config.ts
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Enable local HTTP playback from Windows laptop
        run: node scripts/enable-android-local-http.mjs
      - name: Configure native VLC playback
        run: node scripts/install-vlc-android.mjs
      - name: Generate launcher icons
        run: node scripts/generate-android-icons.mjs
      - name: Configure Maven mirror
        run: |
          cat > android/ci-maven-mirror.init.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories.maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }
              settings.dependencyResolutionManagement.repositories.maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }
          }
          allprojects { repositories { maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") } } }
          EOF
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --init-script ci-maven-mirror.init.gradle --no-daemon --max-workers=2 assembleDebug
      - name: Verify independent package identity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          EXPECTED=com.eleazarcompany.sebasplay.ultra100.independent20261125
          echo "Detected package: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.ultra90.independent20261126"
          test "$ACTUAL" != "com.eleazarcompany.sebasplay.ultra80.independent20261126"
      - name: Upload SEBAS PLAY 10.0 ULTRA APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBAS-PLAY-10-0-ULTRA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
